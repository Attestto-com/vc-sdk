name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repo is pnpm-managed (pnpm-lock.yaml, no package-lock.json), so the
      # previous `npm ci` could never install. Use pnpm.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stub guard
        run: |
          if grep -rn \
            -e 'TODO\|FIXME\|HACK\|XXX' \
            -e 'did:example:\|did:test:\|did:fake:' \
            -e 'alert(' \
            -e 'coming.soon\|Coming Soon\|COMING SOON' \
            --include='*.ts' --include='*.js' \
            --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=tests \
            src/; then
            echo "::error::Stub or placeholder found in src/"
            exit 1
          fi
      # ESLint is not installed in this repo yet (lint script exists, no eslint
      # dependency) — tracked as infra debt under SOC-60. Non-blocking so Test +
      # Build gate PRs until it is configured.
      - name: Lint
        run: pnpm run lint
        continue-on-error: true
      - run: pnpm test
      - run: pnpm run build
